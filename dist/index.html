  let dos=addDays(iso(today()),-ri(1,40));
  if(dos>m.end)dos=addDays(m.end,-ri(1,10));
  const lines=sc[1].map(([cpt,u,mods])=>({cpt,units:CPT[cpt].day?los:(u||1),mods:mods?[...mods]:[],chg:0}));
  if(p.watch&&lines[0]&&/^9921[34]$/.test(lines[0].cpt)&&R()<.7)lines[0].cpt='99215';
  const c={...newClaimId(),rcv:Date.now(),channel:drg?'EDI 837I':wpick(['EDI 837P','EDI 837P','EDI 837P','API (FHIR→837)','Portal','Paper (OCR)'],()=>1),
    mid:m.id,npi:p.npi,dos,pos:p.pos,dx:[...sc[2]],lines,auth:null,cob:null,freq:'1',ov:{},seed:R(),hist:[],adj:[],defect:null,orig:null,type:drg?'I':'P',drg,los,admit:drg?addDays(dos,-los):null,tob:drg?'111':null};
  if((lines.some(l=>CPT[l.cpt].pa)||(drg&&DRG[drg].pa))&&R()<.78){const a='A'+ri(10000000,99999999);c.auth=a;S.auth[m.id+'|'+dos]=a}

function priceCharges(c){const p=prov(c.npi);c.lines.forEach(l=>{if(!l.chg){const r=(CPT[l.cpt]||{r:50}).r;l.chg=r2(r*l.units*(p?p.mult:1)*(1.7+R()*1.1))}})}
const DEFECTS=[['badnpi',.012],['nodx',.01],['baddx',.008],['termed',.025],['late',.018],['bundle',.03],['mue',.02],['mednec',.03],['dup',.03],['sex',.01],['noauth',.02]];
function injectDefect(c,m,p){
  if(c.type==='I'&&UPC[c.drg]&&R()<.2){c.defect='drgup';c.orig={npi:c.npi,dx:[...c.dx],lines:JSON.parse(JSON.stringify(c.lines)),mid:c.mid,dos:c.dos,auth:c.auth,drg:c.drg};c.drg=UPC[c.drg];return}
  let r=R(),d=null;for(const [k,w] of DEFECTS){if(r<w){d=k;break}r-=w}
  if(!d)return;c.defect=d;
  const keep=()=>({npi:c.npi,dx:[...c.dx],lines:JSON.parse(JSON.stringify(c.lines)),mid:c.mid,dos:c.dos,auth:c.auth,drg:c.drg});
  c.orig=keep();
  switch(d){
    case'badnpi':c.npi=c.npi.slice(0,9)+((+c.npi[9]+3)%10);break;
    case'nodx':c.dx=[];break;
    case'baddx':c.dx=[c.dx[0].replace('.','').slice(0,3)+'.9X9'];break;
    case'termed':{const t=S.members.filter(x=>x.end<iso(today()));if(t.length){const tm=pick(t);c.mid=tm.id;c.dos=addDays(tm.end,ri(2,15))}else c.defect=null;break}
    case'late':c.dos=addDays(iso(today()),-ri(130,220));c.lateDays=ri(95,125);if(PLANS[m.plan].tf>=365)c.lateDays=ri(370,400);c.dos=addDays(iso(today()),-c.lateDays-ri(0,5));c.lateDays=daysBetween(c.dos,iso(today()));break;
    case'bundle':{const pr=pick([['45380','45378','Z12.11'],['43239','43235','K21.9'],['80053','85025','E11.9']]);
      if(!['GI','FM','IM'].includes(p.spec)){c.defect=null;break}
      c.lines=[{cpt:pr[0],units:1,mods:[],chg:0},{cpt:pr[1],units:1,mods:[],chg:0}];c.dx=[pr[2]];c.orig.lines=[{cpt:pr[0],units:1,mods:[],chg:0}];c.orig.dx=[pr[2]];break}
    case'mue':{const l=c.lines.find(x=>CPT[x.cpt].mue);if(l){c.orig.lines=JSON.parse(JSON.stringify(c.lines));l.units=CPT[l.cpt].mue+ri(1,3)}else c.defect=null;break}
    case'mednec':{const l=c.lines.find(x=>MEDNEC[x.cpt]);if(l){c.dx=[pick(['J06.9','K21.9','I10','F41.1','S93.401A'].filter(x=>!MEDNEC[l.cpt].some(pf=>x.startsWith(pf))))]}else c.defect=null;break}
    case'dup':{const prior=S.claims.find(o=>['PAID','PARTIAL'].includes(o.status)&&o.freq==='1'&&!o.defect);
      if(prior){c.mid=prior.mid;c.npi=prior.npi;c.dos=prior.dos;c.dx=[...prior.dx];c.lines=JSON.parse(JSON.stringify(prior.lines));c.auth=prior.auth;c.cob=prior.cob;c.dupOf=prior.id}else c.defect=null;break}

  }
}

// ---------- Adjudication engine ----------
function adjudicate(c,opt={}){
  const t0=performance.now(),rl=S.rules,tr=[],ov=c.ov||{};
  const add=(k,s,m)=>tr.push({k,s,m});
  const res={lines:[],status:null,pend:null,denyKeys:[],claimDeny:null,fraud:0,trace:tr,tot:{chg:0,alw:0,paid:0,mr:0,ded:0,copay:0,coins:0,cob:0}};
  const m=mem(c.mid),p=prov(c.npi),P=m&&PLANS[m.plan];
  if(c.pocNote)add('poc','info',c.pocNote);
  // 1 intake
  const errs=[];
  if(!validNPI(c.npi))errs.push(['Billing provider NPI '+c.npi+' fails Luhn check digit','NM1*85 / NPI']);
  else if(!p)errs.push(['NPI '+c.npi+' not found in provider registry','NM1*85']);
  if(!m)errs.push(['Subscriber ID '+c.mid+' not found','NM1*IL']);
  if(!c.dx.length)errs.push(['No principal diagnosis (HI segment missing)','HI*ABK']);
  c.dx.forEach(d=>{if(!ICD[d])errs.push(['Invalid ICD-10-CM code '+d,'HI'])});
  if(!c.lines.length)errs.push(['No service lines','SV1']);
  c.lines.forEach((l,i)=>{if(!CPT[l.cpt])errs.push(['Line '+(i+1)+': invalid CPT/HCPCS '+l.cpt,'SV1'])});
  if(c.dos>iso(today()))errs.push(['Date of service '+c.dos+' is in the future','DTP*472']);
  if(errs.length){errs.forEach(e=>add('intake','fail',e[0]+' ('+e[1]+')'));res.status='REJECTED';res.errs=errs;STAGES.slice(2).forEach(s=>add(s[0],'skip','Not processed — front-end rejection'));res.ms=performance.now()-t0;return res}
  add('intake','pass','999 accepted · 277CA A1:20 · '+c.channel+' · '+c.lines.length+' line(s)'+(c.type==='I'?' · 837I TOB '+c.tob+' · MS-DRG '+c.drg+' · stay '+c.admit+' → '+c.dos:''));
  const L=c.lines.map((l,i)=>({i,cpt:l.cpt,mods:l.mods||[],units:l.units,chg:l.chg,payU:l.units,deny:null,denyKey:null,pendKey:null,cas:[],alw:0,ded:0,copay:0,coins:0,cob:0,paid:0,mr:0,note:''}));
  res.lines=L;
  const lineDeny=(l,carc,key,msg)=>{if(l.deny)return;l.deny=carc;l.denyKey=key;l.note=msg;if(!res.denyKeys.includes(key))res.denyKeys.push(key)};
  const claimDeny=(carc,key,msg)=>{if(!res.claimDeny){res.claimDeny={carc,key,msg};res.denyKeys.push(key)}};
  const pend=(key,msg,lines)=>{if(!res.pend)res.pend={key,msg};(lines||[]).forEach(l=>l.pendKey=key)};
  const dby=k=>!!ov[k],pby=k=>!!(ov[k]||ov.all);
  // 2 eligibility

  else add('elig','pass','271: active '+P.n+' · '+m.start+' → '+m.end);
  const tf=rl.tfOverride||P.tf,lag=daysBetween(c.dos,c.rcvDate||iso(today()));
  if(!res.claimDeny){if(lag>tf){if(dby('tf'))add('elig','warn','Timely filing waived (proof of timely submission)');else{claimDeny('29','tf','Received '+lag+' days after DOS (limit '+tf+')');add('elig','fail','Timely filing: '+lag+' days > '+tf+'-day limit → CO-29')}}
  else add('elig','pass','Timely filing OK: '+lag+' / '+tf+' days')}
  const stop=()=>!!res.claimDeny;
  // 3 provider
  const er=c.lines.some(l=>CPT[l.cpt].cat==='ER')||c.pos==='23';let oon=p.net!=='IN';
  if(stop())add('prov','skip','Skipped (claim-level denial)');
  else if(oon){
    if(er){add('prov','warn',p.name+' is '+p.net+' — emergency services paid at in-network level (No Surprises Act)');oon=false}
    else if(!P.oon&&!dby('oon')){claimDeny('242','oon',p.name+' not in '+P.n+' network');add('prov','fail',p.name+' '+(p.net==='TERM'?'contract terminated':'out-of-network')+'; '+m.plan+' has no OON benefit → CO-242')}
    else add('prov','warn',p.name+' out-of-network → OON benefits ('+Math.round(P.oon.coins*100)+'% coins, OON deductible)');
  } else add('prov','pass',p.name+' · '+SPEC[p.spec]+' · in-network · contract × '+p.mult.toFixed(2)+(P.delegated?' · delegated to Optum Care Network (87726)':''));
  // 4 benefits + PA
  if(stop())add('ben','skip','Skipped');
  else{
    let any=false;
    if(c.type==='I'&&DRG[c.drg]){any=true;const D=DRG[c.drg],a=S.auth[c.mid+'|'+c.dos];
      if(!D.pa)add('ben','pass','Inpatient admission notification on file · MS-DRG '+c.drg+' covered under inpatient benefit');
      else if(a&&(!c.auth||c.auth===a))add('ben','pass','Elective admission (MS-DRG '+c.drg+'): prior auth '+a+' approved (278)');
      else if(dby('auth'))add('ben','warn','Admission retro-authorized by clinical review');
      else if(rl.paMode==='pend'&&!pby('auth')){pend('auth','No inpatient prior auth for MS-DRG '+c.drg,L);add('ben','pend','Elective admission MS-DRG '+c.drg+' without prior auth → pend to Clinical review')}
      else if(!pby('auth')||rl.paMode!=='pend'){L.forEach(l=>lineDeny(l,'197','auth','Inpatient prior authorization required and not on file'));add('ben','fail','Elective admission MS-DRG '+c.drg+' requires prior auth; none on file → CO-197')}
      else add('ben','warn','Admission released by clinical reviewer')}

      if(d.medicare&&!P.medicare&&!dby('medicare')){lineDeny(l,'204','medicare',l.cpt+' is a Medicare-only benefit');add('ben','fail','Line '+(l.i+1)+' '+l.cpt+': not a benefit of '+m.plan+' → CO-204');any=true}

        else if(dby('auth'))add('ben','warn','Line '+(l.i+1)+' '+l.cpt+': retro-authorization approved by clinical review');
        else if(rl.paMode==='pend'&&!pby('auth')){pend('auth','No prior auth on file for '+l.cpt,[l]);add('ben','pend','Line '+(l.i+1)+' '+l.cpt+': no prior auth → pend to Clinical review')}
        else if(!pby('auth')||rl.paMode!=='pend'){lineDeny(l,'197','auth','Prior authorization required and not on file');add('ben','fail','Line '+(l.i+1)+' '+l.cpt+': prior auth required, none on file → CO-197')}
      }});
    if(!any)add('ben','pass','All services are covered benefits; no prior auth required');
  }

  else if(m.other){
    if(ov.cobAmt!=null||c.cob!=null){cobAmt=ov.cobAmt!=null?ov.cobAmt:c.cob;add('cob','pass','UHC secondary to '+m.other+'; primary EOB on file')}
    else if(rl.cobPend&&!pby('cob')){pend('cob','Member has '+m.other+' as primary; primary EOB required');add('cob','pend','Other coverage ('+m.other+') primary — no primary EOB/835 → pend to COB')}

  } else add('cob','pass','No other coverage — UHC primary');

  if(stop())add('code','skip','Skipped');
  else{let issues=0;
    if(rl.sexEdit){const bad=c.dx.find(d=>SEXDX[d]&&SEXDX[d]!==m.sex);if(bad&&!dby('sex')){claimDeny('10','sex','Dx '+bad+' inconsistent with patient sex '+m.sex);add('code','fail','Dx '+bad+' ('+ICD[bad]+') inconsistent with sex '+m.sex+' → CO-10');issues++}}
    if(rl.ncci&&!stop())NCCI.forEach(([a,b,mod])=>{const la=L.find(l=>l.cpt===a&&!l.deny),lb=L.find(l=>l.cpt===b&&!l.deny);
      if(la&&lb){const hasMod=lb.mods.some(x=>['59','XS','XU','25'].includes(x))||la.mods.includes('25');

        else if(!dby('bundle')){lineDeny(lb,'97','bundle',b+' bundled into '+a);add('code','fail','NCCI PTP: '+b+' is a component of '+a+(mod===1?' (no 59/XS/25 modifier)':' (modifier not allowed)')+' → CO-97');issues++}}});
    if(rl.mue&&!stop())L.forEach(l=>{const mx=CPT[l.cpt].mue;if(mx&&l.units>mx&&!l.deny){if(dby('mue'))add('code','warn','MUE exceeded but override applied');else{l.payU=mx;add('code','fail','MUE: '+l.cpt+' billed '+l.units+' units, max '+mx+' → excess '+(l.units-mx)+' unit(s) CO-151');if(!res.denyKeys.includes('mue'))res.denyKeys.push('mue');issues++}}});
    if(!issues)add('code','pass',c.type==='I'?'Revenue codes + ICD-10 valid; MS-DRG grouper inputs complete; no sex/age conflicts':'CPT/HCPCS + ICD-10 valid; no NCCI, MUE or sex/age conflicts');
  }

  if(stop())add('mednec','skip','Skipped');
  else{let chk=0;
    if(c.type==='I'&&DRG[c.drg]){chk++;const D=DRG[c.drg],pdx=c.dx[0]||'',ok=D.dx.some(x=>pdx.startsWith(x));
      const gd=Object.keys(DRG).filter(k=>DRG[k].dx.some(x=>pdx.startsWith(x))).sort((a,b)=>DRG[b].w-DRG[a].w)[0];
      const regroup=()=>{if(gd){res.regroup={from:c.drg,to:gd};res.denyKeys.push('drg');add('mednec','fail','DRG validation: principal dx '+pdx+' groups to MS-DRG '+gd+' ('+DRG[gd].d+'), not '+c.drg+' → regrouped, CO-150')}

      if(ok)add('mednec','pass','DRG validation: principal dx '+pdx+' supports MS-DRG '+c.drg+' ('+D.d+')');

      else if(!pby('drg'))regroup();

    L.forEach(l=>{const pf=MEDNEC[l.cpt];if(!pf||l.deny)return;chk++;
      const ok=c.dx.some(d=>pf.some(x=>d.startsWith(x)));
      if(ok)add('mednec','pass',l.cpt+' supported by '+c.dx.filter(d=>pf.some(x=>d.startsWith(x))).join(', '));

      else if(!pby('mednec')){lineDeny(l,'50','mednec','Diagnosis does not support medical necessity');add('mednec','fail',l.cpt+' not supported by '+c.dx.join(', ')+' → CO-50')}

function priceDRG(c,res,L,P,p,useOON,remDed,remOop,coins,add,lineDeny){

  const base=pay(D.w),billed=res.regroup&&DRG[res.regroup.from]?pay(DRG[res.regroup.from].w):base;
  const cost=chg*.3,thr=base+rl.drgOutlier,out=cost>thr?r2((cost-thr)*.8):0,alw=r2(Math.min(chg,base+out));

  let sh=dd+cp+co;if(sh>remOop){let cut=sh-remOop;const a=Math.min(cut,co);co=r2(co-a);cut-=a;const b=Math.min(cut,cp);cp=r2(cp-b);cut-=b;dd=r2(dd-cut)}
  const acc={alw:0,ded:0,copay:0,coins:0},diff=Math.max(0,billed-base);
  live.forEach((l,i)=>{const last=i===live.length-1,w=l.chg/chg;
    for(const [k,v] of [['alw',alw],['ded',dd],['copay',cp],['coins',co]]){l[k]=last?r2(v-acc[k]):r2(v*w);acc[k]+=l[k]}
    l.mr=r2(l.ded+l.copay+l.coins);l.paid=r2(l.alw-l.mr);
    const wo=r2(l.chg-l.alw),dg=diff?Math.min(wo,r2(diff*w)):0;
    if(dg>0)l.cas.push(['CO','150',dg]);if(wo-dg>0)l.cas.push(['CO','45',r2(wo-dg)]);
    if(l.ded)l.cas.push(['PR','1',l.ded]);if(l.copay)l.cas.push(['PR','3',l.copay]);if(l.coins)l.cas.push(['PR','2',l.coins]);
    if(i===0)l.note='MS-DRG '+code+' case rate (allocated by charge)'});
  add('price','pass','MS-DRG '+code+' '+D.d+' · weight '+D.w.toFixed(2)+' × base '+money(rl.drgBase)+' × '+f.toFixed(2)+(useOON?' (OON)':' (plan × contract)')+' = '+money(base)+(out?' + cost outlier '+money(out):'')+(alw<base+out?' · capped at billed charges':'')+(diff?' · regrouped from '+res.regroup.from+' (−'+money(diff)+', CO-150)':''));
  return remDed}

    case'cobok':act(c,'approve',null,+$('#cobAmt').value||0);closeModal();toast(c.id+' → '+c.status);render(true);break;
    case'deny':act(c,'deny');toast(c.id+' denied');render(true);break;
    case'request':act(c,'request');toast('Request sent (277 P3)');render(true);break;
    case'mclose':closeModal();break;
    case'appeal':modal('<h3>File appeal — '+c.id+'</h3><div class="form" style="grid-template-columns:1fr"><label>Filed by<select id="apBy"><option>Provider ('+esc(prov(c.npi).name)+')</option><option>Member ('+esc(mem(c.mid).fn+' '+mem(c.mid).ln)+')</option></select></label><label>Reason<input type="text" id="apWhy" value="'+esc(APPEAL_REASONS[c.res.denyKeys[0]]||'Request reconsideration')+'"></label></div><p class="hint">Denied for: '+c.res.denyKeys.map(k=>KEY_LABEL[k]||k).join(', ')+'</p><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" data-act="mclose">Cancel</button><button class="btn pri" data-act="apok" data-id="'+c.id+'">File appeal</button></div>');break;
    case'apok':fileAppeal(c,$('#apBy').value,$('#apWhy').value);closeModal();toast('Appeal filed');render(true);break;
    case'overturn':case'uphold':{const ap=S.appeals.find(x=>x.id===id);resolveAppeal(ap,a==='overturn'?'OVERTURNED':'UPHELD','You (appeals analyst)');toast(ap.id+' '+ap.status.toLowerCase());render(true);break}
    case'mine':{const n=runMining();toast(n+' new findings');render(true);break}
    case'recover':case'dismiss':{const rr=S.recov.find(x=>x.id===id);recover(rr,a==='recover');render(true);break}
    case'reset':if(t.dataset.armed){localStorage.removeItem(LS);S=seedWorld();openId=null;closeDrawer();setRunning(true);syncHdr();setView('live');toast('Reset')}else{t.dataset.armed=1;t.textContent='Click again to reset';t.classList.add('bad');setTimeout(()=>{if(t.isConnected){delete t.dataset.armed;t.textContent='Reset';t.classList.remove('bad')}},3000)}break;
    case'preset':F=PRESETS[t.dataset.k]();preview=null;renderSubmit();break;
    case'addline':F.lines.push({cpt:'',mods:'',units:1,chg:0});renderSubmit();break;
    case'rmline':F.lines.splice(+t.dataset.i,1);renderSubmit();break;
    case'precheck':doPrecheck();break;
    case'fixauth':{const a='A'+ri(10000000,99999999);S.auth[F.mid+'|'+F.dos]=a;F.auth=a;renderSubmit();doPrecheck();toast('278 approved: '+a);break}
    case'fixmue':F.lines.forEach(l=>{const mx=(CPT[l.cpt]||{}).mue;if(mx&&l.units>mx)l.units=mx});renderSubmit();doPrecheck();break;
    case'fixbundle':{const codes=F.lines.map(l=>l.cpt);NCCI.forEach(([x,y])=>{if(codes.includes(x)&&codes.includes(y))F.lines=F.lines.filter(l=>l.cpt!==y)});renderSubmit();doPrecheck();break}
    case'submit':{const cc=formClaim();if(S.ui.poc&&pocCheck(cc,false)!=='clean')cc.pocNote='Optum Real flagged issues pre-submission';process(cc,'user');preview=null;renderSubmit();openClaim(cc.id);toast('Submitted '+cc.id+' → '+cc.status);break}
    case'sample837':{const g=genClaim();g.defect=null;$('#raw837').value=gen837(g);break}
    case'parse837':{const x=parse837($('#raw837').value);if(!x.lines.length&&!x.npi){toast('Could not parse 837');break}
      const cc={...newClaimId(),rcv:Date.now(),rcvDate:iso(today()),channel:x.type==='I'?'EDI 837I (pasted)':'EDI 837P (pasted)',type:x.type||'P',drg:x.drg||null,pos:x.type==='I'?'21':x.pos,admit:x.admit||null,tob:x.type==='I'?'111':null,los:x.admit&&x.dos?Math.max(1,daysBetween(x.admit,x.dos)):0,mid:x.mid||'',npi:x.npi||'',dos:x.dos||iso(today()),pos:x.pos||'11',dx:x.dx,freq:x.freq||'1',lines:x.lines.map(l=>({...l,cpt:(l.cpt||'').toUpperCase()})),auth:x.auth||null,cob:null,ov:{},seed:Math.random(),hist:[],adj:[]};
      process(cc,'user');openClaim(cc.id);toast('Parsed & submitted → '+cc.status);break}
    case'rulesdef':S.rulelog.unshift({t:Date.now(),k:'all',o:'custom',n:'defaults'});S.rules={...DEFAULT_RULES};renderRules();toast('Defaults restored');break;
  }
});
document.addEventListener('pointerdown',e=>{if(e.target.id==='csvA')e.target.href=csvHref()});
document.addEventListener('focusin',e=>{if(e.target.id==='csvA')e.target.href=csvHref()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='speed'){S.ui.speed=+t.value;return}
  if(t.id==='pocTog'){S.ui.poc=t.checked;$('#v-live').dataset.init='';log('Optum Real point-of-care validation '+(t.checked?'ON':'OFF'),'poc');render(true);toast(t.checked?'Optum Real on — claims pre-validated at point of care':'Optum Real off');return}
  if(t.id==='plainTog'){S.ui.plain=t.checked;document.body.classList.toggle('plain',t.checked);$('#v-live').dataset.init='';render(true);return}
  if(t.dataset.rule){const k=t.dataset.rule,o=S.rules[k];let n=t.type==='checkbox'?(t.checked?1:0):t.tagName==='SELECT'?t.value:+t.value;S.rules[k]=n;S.rulelog.unshift({t:Date.now(),k,o,n});log('Rule change: '+k+' '+o+' → '+n);renderRules();return}
  if(t.dataset.f){const k=t.dataset.f;F[k]=k==='dx'?t.value.split(/[ ,]+/).map(x=>x.trim().toUpperCase()).filter(Boolean):t.value;if(k!=='dx'&&k!=='auth'&&k!=='cob')renderSubmit();return}
  if(t.dataset.l!=null){const l=F.lines[+t.dataset.l];l[t.dataset.k]=t.dataset.k==='cpt'?t.value.toUpperCase():t.value;if(t.dataset.k==='cpt'&&CPT[l.cpt]&&!+l.chg)l.chg=r2(CPT[l.cpt].r*2.2*(+l.units||1));renderSubmit()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
// ----- Loop -----
let accum=0,lastT=performance.now(),lastSec=0,lastSave=0;
function bucket(){const sec=Math.floor(Date.now()/1000);let b=S.stats.tput[S.stats.tput.length-1];if(!b||b.s!==sec){b={s:sec,n:0,a:0,p:0,d:0,i:0};S.stats.tput.push(b);if(S.stats.tput.length>90)S.stats.tput.shift()}return b}
function tick(){
  const now=performance.now(),dt=Math.min(1,(now-lastT)/1000);lastT=now;
  if(S.ui.running){accum+=S.ui.speed*dt*(.6+Math.random()*.8);let n=0;
    while(accum>=1&&n<60){accum--;n++;const c=process(genClaim());const b=bucket();b.n++;
      if(c.status==='INTERCEPTED')b.i++;else if(c.status==='PENDED')b.p++;else if(['DENIED','REJECTED'].includes(c.status))b.d++;else b.a++}
    bucket();
    if(Date.now()-lastSec>1000){lastSec=Date.now();simExaminers();simAppeals()}
  }
  if(now-lastR>(S.ui.speed>=20?900:500)){lastR=now;render()}
  if(Date.now()-lastSave>5000){lastSave=Date.now();save()}
}
function syncHdr(){$('#speed').value=S.ui.speed;$('#pocTog').checked=S.ui.poc;$('#plainTog').checked=S.ui.plain;document.body.classList.toggle('plain',S.ui.plain)}
function init(){
  S=load()||seedWorld();S.ui.view='live';$('#ver').textContent='v'+VERSION;syncHdr();setRunning(S.ui.running!==false);
  if(!S.claims.length){log('Claims engine online — streaming synthetic 837s from clearinghouses, portal and API');}
  addEventListener('resize',()=>{if(S.ui.view==='live')renderLive()});
  addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  setView('live');setInterval(tick,100);
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();

// ---------- Trends ----------
function renderTrends(){const v=$('#v-trends');
  if(!v.dataset.init){v.dataset.init=1;const k=(c,t)=>'<i style="background:'+c+'"></i>'+t;
    v.innerHTML='<div class="grid g2">'+[['tc1','Claims per 10 s',k('#60a5fa','received')+k('#34d399','finalized')+k('#f87171','rejected (999)')],
      ['tc2','Auto-adjudication & denial rate',k('#34d399','auto-adjudicated')+k('#f87171','denied')+k('#fbbf24','pended on arrival')],
      ['tc3','Dollars per 10 s',k('#a78bfa','plan paid')+k('#f472b6','hospital (837I) paid')+k('#fbbf24','member responsibility')],
      ['tc4','Running auto-adjudication rate',k('#22d3ee','auto ÷ finalized (cumulative)')+k('#94a3b8','85% target')]]
      .map(([id,t,lg])=>'<div class="card"><h2>'+t+'</h2><canvas id="'+id+'" class="tchart"></canvas><div class="lg mut">'+lg+'</div></div>').join('')+
      '</div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>By plan <span class="sp mut" style="text-transform:none">claims in memory</span></h2><div class="tw" id="tbPlan"></div></div><div class="card"><h2>By claim type</h2><div class="tw" id="tbType"></div></div></div>'}
  const T=(S.trend||[]).slice(-60),f=k=>T.map(b=>b[k]),pc=(a,b)=>T.map(x=>x[b]?100*x[a]/x[b]:null);
  let ca=0,cf=0;const cum=T.map(b=>{ca+=b.auto;cf+=b.fin;return cf?100*ca/cf:null});
  tChart('tc1',[[f('rcv'),'#60a5fa'],[f('fin'),'#34d399'],[f('rej'),'#f87171']],T);
  tChart('tc2',[[pc('auto','fin'),'#34d399'],[pc('den','fin'),'#f87171'],[pc('pend','rcv'),'#fbbf24']],T,{pct:1});
  tChart('tc3',[[f('paid'),'#a78bfa'],[f('ipPaid'),'#f472b6'],[f('mr'),'#fbbf24']],T,{money:1});
  tChart('tc4',[[cum,'#22d3ee'],[T.map(()=>85),'#94a3b8']],T,{pct:1});
  const grp=key=>{const g={};S.claims.forEach(c=>{const o=g[key(c)]=g[key(c)]||{n:0,fin:0,auto:0,den:0,pend:0,paid:0,chg:0};o.n++;o.chg+=c.lines.reduce((s,l)=>s+l.chg,0);
    if(c.status==='PENDED')o.pend++;if(c.finalized&&c.res){o.fin++;if(!c.touched)o.auto++;if(c.status==='DENIED')o.den++;o.paid+=c.res.tot.paid}});return g};
  const pct=(a,b)=>b?Math.round(100*a/b)+'%':'–';
  const tbl=(g,lab)=>'<table><thead><tr><th>'+lab+'</th><th>Claims</th><th>Auto</th><th>Denied</th><th>Pended</th><th>Billed</th><th>Plan paid</th><th>Paid ÷ billed</th></tr></thead><tbody>'+
    Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([k,o])=>'<tr><td>'+esc(k)+'</td><td>'+o.n+'</td><td>'+pct(o.auto,o.fin)+'</td><td>'+pct(o.den,o.fin)+'</td><td>'+o.pend+'</td><td>'+money(o.chg)+'</td><td>'+money(o.paid)+'</td><td>'+pct(o.paid,o.chg)+'</td></tr>').join('')+'</tbody></table>';
  $('#tbPlan').innerHTML=tbl(grp(c=>{const m=mem(c.mid);return m?m.plan+' · '+PLANS[m.plan].n:'Unknown member'}),'Plan');
  $('#tbType').innerHTML=tbl(grp(c=>c.type==='I'?'837I institutional (DRG)':'837P professional'),'Claim type')}
function tChart(id,series,T,o={}){const cv=$('#'+id);if(!cv)return;const dpr=devicePixelRatio||1,W=cv.clientWidth||300,H=cv.clientHeight||170;cv.width=W*dpr;cv.height=H*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);const pl=o.money?44:32,pb=16,pt=6,w=W-pl-6,h=H-pb-pt;
  const mx=o.pct?100:Math.max(1,...series.flatMap(s=>s[0].filter(v=>v!=null)))*1.1;
  x.font='10px system-ui,sans-serif';x.fillStyle='#8b9bb4';x.strokeStyle='rgba(148,163,184,.15)';x.lineWidth=1;
  const lab=v=>o.pct?Math.round(v)+'%':o.money?'$'+(v>=1000?(v/1000).toFixed(v>=1e4?0:1)+'k':Math.round(v)):String(Math.round(v));
  for(let i=0;i<=4;i++){const y=pt+h*i/4;x.beginPath();x.moveTo(pl,y);x.lineTo(pl+w,y);x.stroke();x.fillText(lab(mx*(1-i/4)),2,y+3)}
  if(!T.length){x.fillText('Waiting for claims…',pl+8,pt+20);return}
  const fm=t=>new Date(t).toTimeString().slice(0,8),e=fm(T[T.length-1].t);x.fillText(fm(T[0].t),pl,H-3);x.fillText(e,pl+w-x.measureText(e).width,H-3);
  const n=Math.max(T.length,2);
  series.forEach(([vals,col])=>{x.strokeStyle=col;x.lineWidth=2;x.beginPath();let on=false;
    vals.forEach((v,i)=>{if(v==null){on=false;return}const px=pl+w*i/(n-1),py=pt+h*(1-Math.min(v,mx)/mx);on?x.lineTo(px,py):x.moveTo(px,py);on=true});x.stroke()})}
</script>
